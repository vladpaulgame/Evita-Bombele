<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Evită Bombele cu Vieți</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: yellow;
    }
    #overlay, #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #overlay {
      color: red;
      font-size: 28px;
      background: rgba(0,0,0,0.4);
      visibility: hidden;
    }
    #startScreen {
      background: rgba(0,0,0,0.8);
      color: white;
    }
    #startScreen img {
      width: 300px;
      margin-bottom: 40px;
    }
    #startBtn {
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #28a745;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: background 0.3s;
    }
    #startBtn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1024" height="768"></canvas>

  <!-- Ecran START -->
  <div id="startScreen">
    <img src="logo.png" alt="Logo Joc">
    <button id="startBtn">START</button>
  </div>

  <!-- Ecran GAME OVER -->
  <div id="overlay">
    <div id="gameOverText"></div>
    <div>Apasă SPACE pentru a reîncepe</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Dimensiuni și configurări
    const screenWidth = canvas.width;
    const screenHeight = canvas.height;
    const playerSize = 50;
    const bombRadius = 20;
    const giftRadius = 15;
    let playerSpeed = 10;
    let bombSpeed = 3;
    let giftSpeed = 2;
    let bombSpawnRate = 1000;
    let giftSpawnRate = 5000;

    // Stare joc
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let gameStarted = false;

    // Jucător
    const player = {
      x: screenWidth / 2 - playerSize / 2,
      y: screenHeight - playerSize - 10,
      width: playerSize,
      height: playerSize
    };

    // Bombe și cadouri
    let bombs = [];
    let gifts = [];
    let lastBombSpawn = Date.now();
    let lastGiftSpawn = Date.now();

    // Overlay
    const overlay = document.getElementById("overlay");
    const gameOverText = document.getElementById("gameOverText");

    // Start screen
    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");

    // Încărcare imagini
    const playerImg = new Image();
    playerImg.src = "jucator.png";

    const bombImg = new Image();
    bombImg.src = "bomba.png";

    const giftImg = new Image();
    giftImg.src = "cadou.png";

    const bgImg = new Image();
    bgImg.src = "fundal.png";

    // Sunete
    const music = new Audio("muzica_joc.mp3");
    music.loop = true;
    const hitSound = new Audio("explozie.wav");
    const finalMusic = new Audio("muzica_final.mp3");

    // Input
    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (gameOver && e.code === "Space") restartGame();
    });
    document.addEventListener("keyup", (e) => { keys[e.code] = false; });

    // Buton START
    startBtn.addEventListener("click", () => {
      gameStarted = true;
      startScreen.style.display = "none";
      music.play();
    });

    // Funcții joc
    function spawnBomb() {
      const x = Math.random() * (screenWidth - bombRadius * 2);
      bombs.push({ x: x, y: 0, size: bombRadius * 2 });
    }

    function spawnGift() {
      const x = Math.random() * (screenWidth - giftRadius * 2);
      gifts.push({ x: x, y: 0, size: giftRadius * 2 });
    }

    function rectsCollide(a, b) {
      return (
        a.x < b.x + b.size &&
        a.x + a.width > b.x &&
        a.y < b.y + b.size &&
        a.y + a.height > b.y
      );
    }

    function updateGame() {
      // Mișcare jucător
      if (keys["ArrowLeft"] && player.x > 0) player.x -= playerSpeed;
      if (keys["ArrowRight"] && player.x + player.width < screenWidth) player.x += playerSpeed;

      // Spawning
      if (Date.now() - lastBombSpawn > bombSpawnRate) {
        spawnBomb();
        lastBombSpawn = Date.now();
      }
      if (Date.now() - lastGiftSpawn > giftSpawnRate) {
        spawnGift();
        lastGiftSpawn = Date.now();
      }

      // Bombe
      bombs.forEach((bomb, i) => {
        bomb.y += bombSpeed;
        if (rectsCollide(player, bomb)) {
          loseLife();
          bombs.splice(i, 1);
        } else if (bomb.y > screenHeight) {
          bombs.splice(i, 1);
          score++;
          if (score % 5 === 0) {
            bombSpeed += 0.3;
            bombSpawnRate = Math.max(300, bombSpawnRate - 50);
          }
        }
      });

      // Cadouri
      gifts.forEach((gift, i) => {
        gift.y += giftSpeed;
        if (rectsCollide(player, gift)) {
          lives++;
          gifts.splice(i, 1);
        } else if (gift.y > screenHeight) {
          gifts.splice(i, 1);
        }
      });
    }

    function loseLife() {
      lives--;
      music.pause();
      hitSound.play();
      setTimeout(() => { music.play(); }, 400);

      if (lives <= 0) endGame();
    }

    function endGame() {
      gameOver = true;
      music.pause();
      finalMusic.play();
      overlay.style.visibility = "visible";
      gameOverText.textContent = "JOC TERMINAT! Scor final: " + score;
    }

    function restartGame() {
      score = 0;
      lives = 3;
      bombSpeed = 3;
      bombSpawnRate = 1000;
      gameOver = false;
      bombs = [];
      gifts = [];
      player.x = screenWidth / 2 - playerSize / 2;
      player.y = screenHeight - playerSize - 10;
      lastBombSpawn = Date.now();
      lastGiftSpawn = Date.now();
      overlay.style.visibility = "hidden";
      finalMusic.pause();
      finalMusic.currentTime = 0;
      music.currentTime = 0;
      music.play();
    }

    function draw() {
      ctx.drawImage(bgImg, 0, 0, screenWidth, screenHeight);

      if (!gameOver) {
        ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

        bombs.forEach(bomb => {
          ctx.drawImage(bombImg, bomb.x, bomb.y, bomb.size, bomb.size);
        });
        gifts.forEach(gift => {
          ctx.drawImage(giftImg, gift.x, gift.y, gift.size, gift.size);
        });

        ctx.fillStyle = "black";
        ctx.font = "16px Arial";
        ctx.fillText("Scor: " + score, 20, 20);

        ctx.fillStyle = "green";
        ctx.fillText("Vieți: " + lives, 20, 50);
      }
    }

    function gameLoop() {
      if (gameStarted && !gameOver) updateGame();
      if (gameStarted) draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
